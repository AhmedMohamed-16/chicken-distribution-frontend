<div class="dialog-content">

    <!-- Header -->
    <div class="dialog-header">
        <h2 mat-dialog-title class="dialog-title">
            صرف مرتب
        </h2>

        <p class="dialog-subtitle">
            تسجيل عملية صرف مرتب موظف
        </p>
    </div>

    <!-- Form -->
    <form [formGroup]="salaryForm" class="salary-form">

        <!-- Employee + Amount -->
        <div class="form-grid">

            <mat-form-field appearance="outline">
                <mat-label>الموظف</mat-label>

                <mat-select formControlName="employee_id">

                    @for (emp of employees(); track emp.id) {
                    <mat-option [value]="emp.id">
                        {{ emp.name }}
                    </mat-option>
                    }

                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>المبلغ</mat-label>

                <input
                    matInput
                    type="number"
                    formControlName="amount"
                    min="1">

                <span matTextSuffix>ج.م</span>
            </mat-form-field>

        </div>

        <!-- Month + Year -->
        <div class="form-grid">

            <mat-form-field appearance="outline">
                <mat-label>الشهر</mat-label>

                <mat-select formControlName="period_month">

                    @for (month of monthNames; track month; let i = $index) {
                    <mat-option [value]="i + 1">
                        {{ month }}
                    </mat-option>
                    }

                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>السنة</mat-label>

                <input
                    matInput
                    type="number"
                    formControlName="period_year"
                    [value]="currentYear">
            </mat-form-field>

        </div>

        <!-- Payment Date -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>تاريخ الصرف</mat-label>

            <input
                matInput
                [matDatepicker]="paymentDatePicker"
                formControlName="payment_date">

            <mat-datepicker-toggle
                matSuffix
                [for]="paymentDatePicker">
            </mat-datepicker-toggle>

            <mat-datepicker #paymentDatePicker></mat-datepicker>
        </mat-form-field>

        <!-- Payment Method -->
        <div class="payment-section">
            <app-payment-method-selector
                [parentForm]="salaryForm">
            </app-payment-method-selector>
        </div>

        <!-- Notes -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>ملاحظات (اختياري)</mat-label>

            <textarea
                matInput
                formControlName="notes"
                rows="3">
            </textarea>
        </mat-form-field>

    </form>

    <!-- Actions -->
    <div
        mat-dialog-actions
        class="dialog-actions">

        <button
            mat-stroked-button
            mat-dialog-close
            class="cancel-button">

            إلغاء
        </button>

        <button
            mat-raised-button
            color="primary"
            class="submit-button"
            (click)="submit()"
            [disabled]="salaryForm.invalid || submitting()">

            @if (submitting()) {
            <mat-icon>hourglass_empty</mat-icon>
            }

            <span>
                صرف المرتب
            </span>

        </button>

    </div>

</div>
